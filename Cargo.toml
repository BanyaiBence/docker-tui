[package]
name = "docker-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
indexmap = "2.14.2"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-input = "0.15.5"
tui-term = "0.3.4"
vt100 = "0.16"

[dev-dependencies]
insta = "1.49.0"
